<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Troop</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      overflow-x: hidden;
    }

    /* Hero section */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 30px;
      position: relative;
      z-index: 1;
    }

    .title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 4rem;
      letter-spacing: 0.15em;
      color: #f0ead6;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(76, 175, 80, 0.15);
    }

    .subtitle {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 1.4rem;
      color: rgba(129, 199, 132, 0.8);
      letter-spacing: 0.05em;
      margin-bottom: 50px;
    }

    .epigraph {
      max-width: 550px;
      margin: 0 auto 60px;
      padding: 35px 40px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .epigraph::before,
    .epigraph::after {
      content: '"';
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 4rem;
      color: var(--vine);
      opacity: 0.4;
      position: absolute;
      line-height: 1;
    }

    .epigraph::before {
      top: 10px;
      left: 10px;
    }

    .epigraph::after {
      content: '"';
      bottom: 0;
      right: 10px;
    }

    .epigraph p {
      font-style: italic;
      font-size: 1.15rem;
      color: #f0ead6;
      line-height: 1.9;
    }

    .epigraph cite {
      display: block;
      margin-top: 20px;
      font-size: 0.95rem;
      color: rgba(129, 199, 132, 0.6);
      letter-spacing: 0.08em;
    }

    /* Scroll indicator */
    .scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: rgba(129, 199, 132, 0.5);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      animation: bounce 2s infinite;
    }

    .scroll-hint span {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .scroll-hint::after {
      content: '↓';
      font-size: 1.5rem;
      display: block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    /* Primate section */
    .primate-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 30px;
      position: relative;
      z-index: 1;
    }

    .primate-container {
      position: relative;
      cursor: pointer;
      transition: transform 0.5s ease;
      text-align: center;
    }

    .primate-container:hover {
      transform: scale(1.02);
    }

    .primate-image {
      max-width: 550px;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.5));
    }

    /* Fallback if no image */
    .primate-fallback {
      display: none;
      width: 400px;
      height: 350px;
      background: var(--canopy);
      border-radius: 12px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .no-image .primate-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
    }

    .no-image .primate-image {
      display: none;
    }

    .fallback-emoji {
      font-size: 5rem;
      opacity: 0.6;
    }

    .fallback-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.2rem;
      color: rgba(129, 199, 132, 0.6);
      font-style: italic;
    }

    .click-hint {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      color: rgba(129, 199, 132, 0.6);
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .primate-container:hover .click-hint {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 2.5rem;
        letter-spacing: 0.1em;
      }

      .subtitle {
        font-size: 1.1rem;
      }

      .primate-image {
        max-width: 320px;
      }

      .epigraph {
        padding: 25px 20px;
      }

      .primate-fallback {
        width: 300px;
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <h1 class="title">The Troop</h1>
    <p class="subtitle">Projects, notes, and things I'm figuring out</p>

    <div class="epigraph">
      <p>ooh ooh ahh ahh</p>
      <cite>— Gorilla</cite>
    </div>

    <div class="scroll-hint">
      <span>Scroll to enter</span>
    </div>
  </section>

  <!-- Primate Entrance Section -->
  <section class="primate-section" id="entrance">
    <a href="library.html" class="primate-container" title="Enter">
      <img src="images/primates_group_1.png" alt="The Troop" class="primate-image"
           onerror="this.parentElement.classList.add('no-image')">

      <!-- Fallback if image doesn't load -->
      <div class="primate-fallback">
        <span class="fallback-emoji">🦍🦧🐒</span>
        <span class="fallback-text">Click to enter</span>
      </div>

      <span class="click-hint">Click to enter</span>
    </a>
  </section>
</body>
</html>
