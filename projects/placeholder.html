<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02: Project II - The Troop</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .project-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 30px;
      position: relative;
      z-index: 1;
    }

    .project-cover {
      background: linear-gradient(135deg, #3e2723 0%, #4e342e 50%, #3e2723 100%);
      padding: 60px 40px;
      text-align: center;
      margin-bottom: 50px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .project-cover::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('../images/orangutan_1.png');
      background-size: cover;
      background-position: center;
      opacity: 0.1;
    }

    .project-cover::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, #3e2723, transparent);
    }

    .project-cover .project-number {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
      color: rgba(212, 165, 116, 0.6);
      letter-spacing: 0.3em;
      margin-bottom: 15px;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
    }

    .project-cover h1 {
      color: var(--fur);
      font-size: 3rem;
      margin-bottom: 15px;
      position: relative;
      z-index: 2;
    }

    .project-cover .subtitle {
      color: rgba(212, 165, 116, 0.6);
      font-style: italic;
      font-size: 1.2rem;
      position: relative;
      z-index: 2;
    }

    .placeholder-content {
      text-align: center;
      padding: 80px 40px;
    }

    .placeholder-icon {
      font-size: 4rem;
      margin-bottom: 30px;
      opacity: 0.5;
    }

    .placeholder-content h2 {
      margin-bottom: 20px;
    }

    .placeholder-content p {
      max-width: 500px;
      margin: 0 auto;
      color: rgba(232, 224, 204, 0.5);
      font-style: italic;
    }

    .project-nav {
      display: flex;
      justify-content: space-between;
      padding-top: 40px;
      margin-top: 50px;
      border-top: 1px solid var(--border);
    }

    .project-nav a {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .project-nav .next::after { content: ' →'; }
    .project-nav .prev::before { content: '← '; }

    @media (max-width: 600px) {
      .project-cover { padding: 40px 30px; }
      .project-cover h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <a href="../library.html" class="nav-back">Return to Troop</a>

  <div class="project-container container">
    <header class="project-cover">
      <p class="project-number">Territory 02</p>
      <h1>Untitled</h1>
      <p class="subtitle">A work in progress...</p>
    </header>

    <div class="placeholder-content">
      <div class="placeholder-icon">🦧</div>
      <h2>This Territory is Being Explored</h2>
      <p>
        This space is waiting for its story. Check back soon for new additions.
      </p>
    </div>

    <nav class="project-nav">
      <a href="homelab.html" class="prev">Project 01: Homelab</a>
      <a href="study.html" class="next">Project 03: Curriculum</a>
    </nav>
  </div>
</body>
</html>
